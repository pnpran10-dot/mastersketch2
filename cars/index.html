<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MasterDrive – rent or buy your next car</title>
<meta name="description" content="Find, book and rent a car easily. Spin every car in 3D, sit inside, see real photos, then rent by the day or buy. Works on phones, Mac and PC in 15 languages.">
<meta name="theme-color" content="#0c0d0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
/* Layout: dark showroom; lime is the single accent, used for the one action that matters in each view. */
:root{
  --bg:#0c0d0b;--surface:#161714;--surface2:#1f211d;--surface3:#2a2c27;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --text:#f2f4ec;--muted:#a3a89a;--faint:#6f7468;
  --lime:#ddf160;--lime2:#c9e04a;--lime-ink:#141907;
  --ok:#7ee08a;--warn:#f5c35b;--bad:#ff6b5e;
  --font:"Saira","Noto Sans Thai","Noto Sans Arabic","Noto Sans Devanagari","Hiragino Sans","PingFang SC","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:28px;--r-md:20px;--r-sm:14px;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.45;overflow-x:hidden;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.logo-svg{fill:currentColor;stroke:none;width:1.25em;height:1.25em;flex:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}

/* Header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px max(20px,env(safe-area-inset-right)) 14px max(20px,env(safe-area-inset-left));padding-top:max(14px,env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;text-decoration:none;letter-spacing:.01em}
.logo-mark{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--lime);border:1px solid var(--line2)}
.logo b{color:var(--lime);font-weight:700}
.nav{display:flex;gap:4px;margin-inline-start:24px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;transition:.2s}
.nav a:hover{color:var(--text)}
.nav a.on{background:var(--lime);color:var(--lime-ink);font-weight:600}
.count{min-width:19px;height:19px;border-radius:10px;background:var(--text);color:var(--bg);font-size:.7rem;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.nav a.on .count{background:var(--lime-ink);color:var(--lime)}
.spacer{flex:1}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.pill select{background:transparent;border:0;outline:0;font-weight:500;font-size:.92rem;max-width:140px;cursor:pointer}
.pill select option{background:var(--surface);color:var(--text)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--text);transition:.2s;flex:none}
.icon-btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.icon-btn.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.icon-btn.white{background:#fff;color:#111;border-color:transparent}
.icon-btn.on{background:var(--lime);color:var(--lime-ink)}

main{max-width:1320px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 130px max(20px,env(safe-area-inset-left))}
.view{display:none;animation:fade .4s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:28px;align-items:stretch;padding:26px 0 36px}
.hero-copy{display:flex;flex-direction:column;gap:22px;justify-content:center;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
h1{font-size:clamp(2.4rem,5.2vw,4.4rem);line-height:1.02;margin:0;font-weight:600;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--lime)}
.hero-copy>p{margin:0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.15rem);max-width:46ch}
.finder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:10px}
.finder .seg{width:100%}
.finder .seg button{flex:1}
.finder-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.finder-row .finder-field:first-child{grid-column:1/-1}
.finder-field{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2);min-width:0}
.finder-field>svg{color:var(--lime)}
.finder-field label{display:grid;gap:1px;min-width:0;flex:1}
.finder-field small{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.finder-field input{background:transparent;border:0;outline:0;font-weight:600;min-width:0;width:100%;color-scheme:dark}
.btn-search{height:56px;border-radius:999px;border:0;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.btn-search:hover{background:var(--lime2)}

.showcase{position:relative;min-height:440px;border-radius:36px;background:var(--lime);overflow:hidden;isolation:isolate;color:var(--lime-ink)}
.showcase::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(20,25,7,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(20,25,7,.09) 1px,transparent 1px);background-size:34px 34px}
.ghost{position:absolute;inset:auto 0 auto 0;top:16%;z-index:-1;text-align:center;font-weight:800;font-size:clamp(5rem,13vw,11rem);line-height:.9;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(20,25,7,.16);white-space:nowrap;overflow:hidden;text-transform:uppercase}
.showcase .stage-host{position:absolute;inset:0}
.show-top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:start;gap:12px;z-index:2;pointer-events:none}
.show-top>*{pointer-events:auto}
.show-name small{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1rem;opacity:.8}
.show-name small svg.logo-svg{width:24px;height:24px}
.show-name b{display:block;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.05;font-weight:700}
.show-arrows{display:flex;gap:8px}
.show-arrows button{width:44px;height:44px;border-radius:50%;border:0;background:var(--lime-ink);color:var(--lime);display:grid;place-items:center}
.notch{position:absolute;right:0;bottom:0;z-index:2;background:var(--bg);padding:12px 0 0 12px;border-top-left-radius:30px}
.notch::before,.notch::after{content:"";position:absolute;width:30px;height:30px;background:transparent;border-bottom-right-radius:30px;box-shadow:12px 12px 0 var(--bg)}
.notch::before{top:-30px;right:0}
.notch::after{left:-30px;bottom:0}
.notch a{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);color:var(--text);text-decoration:none;font-weight:600}
.notch a svg{color:var(--lime)}
.show-price{position:absolute;left:22px;bottom:22px;z-index:2;font-weight:700;font-size:1.3rem}
.show-price small{display:block;font-weight:500;font-size:.8rem;opacity:.7}

/* Section heads & filters */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 14px}
.sec-head h2{margin:0;font-size:1.45rem;font-weight:600}
.sec-head span{color:var(--faint);font-size:.92rem}
.brands{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin-bottom:26px}
.brands::-webkit-scrollbar{display:none}
.brand-chip{flex:none;display:flex;align-items:center;gap:10px;height:54px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;transition:.2s}
.brand-chip svg.logo-svg{width:22px;height:22px}
.brand-chip:hover{border-color:var(--line2)}
.brand-chip.on{background:#fff;color:#111;border-color:#fff}
.monogram{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.62rem;font-weight:800;letter-spacing:0;background:currentColor}
.monogram span{color:var(--bg);mix-blend-mode:normal}
.brand-chip.on .monogram span{color:#fff}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:10px 18px;border-radius:999px;font-weight:500;font-size:.92rem;color:var(--muted);transition:.2s;display:flex;gap:6px;align-items:center}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.fav.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}

/* Car cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .3s,border-color .3s,background .3s;overflow:hidden;isolation:isolate}
.card::after{content:"";position:absolute;left:10%;right:10%;top:44%;height:46%;z-index:-1;background:radial-gradient(closest-side,rgba(221,241,96,.13),transparent);opacity:0;transition:.4s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--surface2)}
.card:hover::after{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:1.02rem}
.brand-line svg.logo-svg{width:20px;height:20px;color:var(--text)}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.88rem;white-space:nowrap}
.rating svg{color:var(--lime);fill:var(--lime);stroke:none}
.card h3{margin:0;font-size:clamp(1.6rem,2.4vw,2rem);line-height:1.05;font-weight:600;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.86rem}
.meta span{display:inline-flex;align-items:center;gap:6px}
.card-media{position:relative;aspect-ratio:5/3;margin:6px -10px 0;max-width:calc(100% + 20px)}
.card-media img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .5s}
.card-media img.photo{object-fit:cover;border-radius:var(--r-md)}
.card:hover .card-media img{transform:scale(1.04)}
.shimmer{position:absolute;inset:12% 6%;border-radius:var(--r-md);background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.badges{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface3);color:var(--text)}
.badge.ev{background:rgba(221,241,96,.14);color:var(--lime)}
.badge.off{background:rgba(255,107,94,.16);color:var(--bad)}
.card-foot{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:auto}
.card-foot small{display:block;color:var(--faint);font-size:.8rem}
.card-foot b{font-size:1.45rem;font-weight:700}
.card-foot b span{font-size:.85rem;color:var(--muted);font-weight:500}
.card-acts{display:flex;gap:8px}
.go{width:52px;height:52px;border-radius:50%;border:0;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;transition:.25s}
.go svg{width:22px;height:22px;stroke-width:2.2}
.card:hover .go{transform:rotate(45deg)}
.heart{width:52px;height:52px}
.heart.on{color:var(--lime)}
.heart.on svg{fill:var(--lime)}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);display:grid;justify-items:center;gap:10px}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;transition:.2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--lime);border-color:transparent;color:var(--lime-ink)}
.btn.primary:hover{background:var(--lime2)}
.btn.dark{background:var(--text);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.sm{height:38px;padding:0 14px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:.82rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface2);outline:0;transition:.2s;color-scheme:dark}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(221,241,96,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--lime)}
.check small{display:block;color:var(--faint)}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:.86rem}
.seg{display:inline-flex;padding:5px;border-radius:999px;background:var(--surface2);gap:2px}
.seg button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:500;font-size:.92rem;color:var(--muted);transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--surface2)}

/* Dialogs */
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:none;max-height:none}
dialog::backdrop{background:rgba(5,6,4,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.sheet-close{position:absolute;top:16px;inset-inline-end:16px;z-index:5}
#dlg-car .sheet{width:min(1240px,calc(100vw - 32px));height:min(800px,calc(100vh - 32px));display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);padding:12px;gap:12px}
.stage{position:relative;background:var(--lime);border-radius:26px;min-height:0;overflow:hidden;isolation:isolate;color:var(--lime-ink)}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(20,25,7,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(20,25,7,.09) 1px,transparent 1px);background-size:34px 34px}
.stage.inside{background:linear-gradient(#dfe7ee,#f4f6f8 55%,#cfd6dc);}
.stage.inside::before,.stage.inside .ghost{display:none}
.stage.photos{background:#000}
.stage.photos::before,.stage.photos .ghost{display:none}
.stage-host{position:absolute;inset:0}
.stage-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.stage-canvas:active{cursor:grabbing}
.stage-top{position:absolute;top:14px;inset-inline-start:14px;inset-inline-end:14px;display:flex;gap:8px;flex-wrap:wrap;z-index:3}
.stage-top .seg{background:rgba(20,25,7,.88)}
.stage-top .seg button{color:#c9cfbc}
.stage-top .seg button.on{background:var(--lime);color:var(--lime-ink)}
.stage-bottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;gap:10px;z-index:3;pointer-events:none;flex-wrap:wrap}
.stage-bottom>*{pointer-events:auto}
.swatches{display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(20,25,7,.88)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25);transition:.2s}
.sw.on{outline:2px solid var(--lime);outline-offset:2px;transform:scale(1.1)}
.round-acts{display:flex;gap:8px;align-items:center}
.round-acts .icon-btn{width:50px;height:50px;background:rgba(20,25,7,.88);color:#f2f4ec;border:0}
.round-acts .icon-btn.on{background:#fff;color:#111}
.stage-note{position:absolute;left:18px;bottom:76px;z-index:3;font-size:.76rem;font-weight:500;opacity:.6}
.stage.photos .stage-note,.stage.inside .stage-note{display:none}
.gallery{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;padding:68px 14px 14px}
.gallery.on{display:flex}
.gallery .main{flex:1;min-height:0;border-radius:18px;overflow:hidden;position:relative}
.gallery .main img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.thumbs button{flex:none;width:78px;height:56px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;background:#111}
.thumbs button.on{border-color:var(--lime)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.gallery .empty{margin:auto;color:#c9cfbc;border-color:#333}
.panel{min-width:0;overflow-y:auto;padding:22px 16px 24px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start;overscroll-behavior:contain}
.panel h2{margin:0;font-size:clamp(1.8rem,3vw,2.5rem);line-height:1.02;font-weight:600;padding-inline-end:52px}
.panel .brand-line{font-size:1.05rem}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spec{padding:14px 10px;border-radius:var(--r-md);background:var(--surface2);display:grid;gap:4px;text-align:center;min-width:0}
.spec svg{margin:0 auto;color:var(--lime)}
.spec b{font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.spec small{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.book{border-radius:var(--r);background:var(--surface2);padding:16px;display:grid;gap:14px}
.book .seg{background:var(--surface3)}
.lines{display:grid;gap:9px;font-size:.95rem}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .total{padding-top:11px;border-top:1px dashed var(--line2);font-weight:700;font-size:1.15rem}
.big-price{font-size:2.3rem;font-weight:700;line-height:1}
.big-price span{font-size:1rem;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--lime)}

#dlg-checkout .sheet,#dlg-edit .sheet,#dlg-info .sheet{width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow-y:auto}
.sheet-pad{padding:28px;display:grid;gap:16px}
.sheet-pad h3{margin:0;font-size:1.45rem;font-weight:600;padding-inline-end:52px;display:flex;align-items:center;gap:10px}
.pay-opts{display:grid;gap:8px}
.pay-opt{display:flex;gap:12px;align-items:center;padding:15px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--surface2);cursor:pointer;transition:.2s}
.pay-opt:has(input:checked){border-color:var(--lime);background:rgba(221,241,96,.07)}
.pay-opt input{accent-color:var(--lime);width:18px;height:18px}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:var(--r-md);font-size:.88rem;background:rgba(245,195,91,.08);border:1px solid rgba(245,195,91,.3);color:#f3dca6}
.success{text-align:center;display:grid;gap:12px;justify-items:center;padding:20px 0}
.success .tick{width:76px;height:76px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-size:2rem}
.code{font-size:1.4rem;font-weight:700;letter-spacing:.14em;padding:10px 18px;border-radius:var(--r-sm);background:var(--surface2);border:1px dashed var(--lime)}

#lightbox{width:100vw;height:100vh;background:rgba(0,0,0,.95)}
#lightbox img{width:100%;height:100%;object-fit:contain}
#lightbox .lb-nav{position:fixed;top:50%;transform:translateY(-50%)}
#lightbox .prev{inset-inline-start:16px}
#lightbox .next{inset-inline-end:16px}
#lightbox .sheet-close{position:fixed}

/* Trips & admin */
.page-head{padding:34px 0 22px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:600}
.list{display:grid;gap:12px}
.trip{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.trip img{width:140px;height:90px;object-fit:contain;border-radius:var(--r-sm);background:var(--lime)}
.trip img.photo{object-fit:cover}
.trip h4{margin:0 0 4px;font-size:1.1rem;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:rgba(126,224,138,.14);color:var(--ok)}
.status.cancelled{background:rgba(255,107,94,.14);color:var(--bad)}
.panel-card{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:16px;min-width:0}
.panel-card h3{margin:0;font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:10px}
.panel-card h3 svg{color:var(--lime)}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.admin-col{display:grid;gap:18px;min-width:0}
.auth-card{max-width:480px;margin:40px auto}
.role{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.role.owner{background:var(--lime);color:var(--lime-ink)}
.role.admin{background:var(--surface3);color:var(--text)}
.admin-car{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;border-radius:var(--r-md);background:var(--surface2)}
.admin-car img{width:84px;height:54px;object-fit:contain;border-radius:12px;background:var(--lime)}
.admin-car img.photo{object-fit:cover}
.admin-car .acts{display:flex;gap:6px}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2)}
.draft-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r);margin-bottom:18px;background:rgba(221,241,96,.08);border:1px solid rgba(221,241,96,.35)}
.draft-bar>svg{color:var(--lime)}
.draft-bar .grow{flex:1;min-width:200px}
.drop{border:2px dashed var(--line2);border-radius:var(--r-md);padding:24px;text-align:center;color:var(--muted);transition:.2s;cursor:pointer;display:grid;gap:6px;justify-items:center}
.drop svg{color:var(--lime);width:28px;height:28px}
.drop.over{border-color:var(--lime);background:rgba(221,241,96,.06);color:var(--text)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photo-grid figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;background:#000}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.photo-grid .p-acts{position:absolute;inset:auto 6px 6px;display:flex;justify-content:space-between}
.photo-grid .p-acts button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.photo-grid .cover{position:absolute;top:6px;inset-inline-start:6px;background:var(--lime);color:var(--lime-ink)}
.colors-edit{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.colors-edit label{position:relative}
.colors-edit input[type=color]{width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);padding:0;background:none;cursor:pointer}
.colors-edit input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.colors-edit input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.colors-edit .x{position:absolute;top:-6px;inset-inline-end:-6px;width:18px;height:18px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:100;padding:13px 20px;border-radius:999px;background:var(--lime);color:var(--lime-ink);font-weight:600;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1320px;margin:0 auto;padding:30px max(20px,env(safe-area-inset-right)) 50px max(20px,env(safe-area-inset-left));color:var(--faint);font-size:.86rem;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line)}
footer a{color:var(--muted)}

/* Phones: bottom tab bar like a native app */
.tabbar{display:none}
@media (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .showcase{min-height:360px;order:-1}
  #dlg-car{margin:0;width:100vw;height:100dvh}
  #dlg-car .sheet{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(320px,48vh) minmax(0,1fr);width:100vw;height:100dvh;border-radius:0;border:0;padding:0;gap:0}
  #dlg-car .stage{border-radius:0 0 28px 28px}
  .panel{padding:22px 18px 40px}
  .admin-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .nav,.top .pill.cur-pill{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .tabbar{display:flex;position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;justify-content:space-between;align-items:center;padding:8px;border-radius:999px;background:rgba(31,33,29,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2)}
  .tabbar a{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;text-decoration:none;font-size:.85rem;font-weight:600;color:var(--muted);position:relative;min-width:0}
  .tabbar a span:not(.count){display:none}
  .tabbar a svg{width:23px;height:23px}
  .tabbar a.on{background:var(--lime);color:var(--lime-ink);flex:1.6}
  .tabbar a.on span:not(.count){display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar .count{position:absolute;top:6px;left:calc(50% + 6px)}
  .tabbar a.on .count{position:static}
  .logo span:last-child{display:none}
  .hero{padding:10px 0 26px;gap:22px}
  .showcase{min-height:330px;border-radius:30px}
  .specs{grid-template-columns:repeat(2,1fr)}
  .trip{grid-template-columns:96px minmax(0,1fr)}
  .trip img{width:96px;height:64px}
  .trip .acts{grid-column:1/-1}
  .row3{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:minmax(0,1fr)}
  .pill select{max-width:110px}
  .notch a{padding:12px 16px;font-size:.9rem}
  #dlg-checkout .sheet,#dlg-edit .sheet,#dlg-info .sheet{width:100vw;max-height:92dvh;border-radius:30px 30px 0 0;position:fixed;bottom:0;left:0;margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/browse" aria-label="MasterDrive">
    <span class="logo-mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 14l2-5a3 3 0 0 1 2.8-2h8.4A3 3 0 0 1 19 9l2 5v4h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3z"/></svg></span>
    <span>Master<b>Drive</b></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <div class="tools">
    <label class="pill" data-i18n-title="language"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="sel-lang"></select></label>
    <label class="pill cur-pill" data-i18n-title="currency"><select id="sel-cur"></select></label>
  </div>
</header>

<main>
  <section class="view" id="view-browse">
    <div class="hero">
      <div class="hero-copy">
        <span class="eyebrow"><i></i><span data-i18n="heroEyebrow"></span></span>
        <h1 id="hero-title"></h1>
        <p data-i18n="heroSub"></p>
        <form class="finder" id="finder">
          <div class="seg" id="seg-mode"></div>
          <div class="finder-row">
            <div class="finder-field"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <label for="q"><small data-i18n="searchLabel"></small><input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off"></label></div>
            <div class="finder-field" data-rent-only><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
              <label for="f-from"><small data-i18n="pickUp"></small><input id="f-from" type="date"></label></div>
            <div class="finder-field" data-rent-only><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
              <label for="f-to"><small data-i18n="return"></small><input id="f-to" type="date"></label></div>
          </div>
          <button class="btn-search" type="submit"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i18n="searchCars"></span></button>
        </form>
      </div>
      <div class="showcase" id="showcase">
        <div class="ghost" id="show-ghost"></div>
        <div class="stage-host" id="hero-host"></div>
        <div class="show-top">
          <div class="show-name" id="show-name"></div>
          <div class="show-arrows">
            <button type="button" id="show-prev" aria-label="‹"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
            <button type="button" id="show-next" aria-label="›"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="show-price" id="show-price"></div>
        <div class="notch"><a href="#" id="show-open"><span data-i18n="driveYourWay"></span><svg class="i" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div>
      </div>
    </div>

    <div class="sec-head"><h2 data-i18n="topBrands"></h2></div>
    <div class="brands" id="brands"></div>

    <div class="sec-head"><h2 data-i18n="selectCar"></h2><span id="count"></span></div>
    <div class="filters">
      <div class="chips" id="chips-body"></div>
      <label class="pill"><select id="sel-fuel" aria-label="fuel"></select></label>
      <label class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg><select id="sel-sort" aria-label="sort"></select></label>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="view" id="view-trips">
    <div class="page-head"><h2 data-i18n="tripsTitle"></h2></div>
    <div class="list" id="trips"></div>
  </section>

  <section class="view" id="view-admin"><div id="admin"></div></section>
</main>

<footer>
  <span>© <span id="year"></span> MasterDrive · <span data-i18n="footerNote"></span></span>
  <span><span data-i18n="credits"></span> · <a href="#/admin" data-i18n="ownerLogin"></a> <a href="#" id="btn-install" hidden data-i18n="install"></a></span>
</footer>

<nav class="tabbar" id="tabbar"></nav>

<dialog id="dlg-car"><div class="sheet" id="car-sheet"></div></dialog>
<dialog id="dlg-checkout"><div class="sheet" id="checkout-sheet"></div></dialog>
<dialog id="dlg-edit"><div class="sheet" id="edit-sheet"></div></dialog>
<dialog id="dlg-info"><div class="sheet" id="info-sheet"></div></dialog>
<dialog id="lightbox"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
